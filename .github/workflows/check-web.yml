name: Check CosmicV Web

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/check-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/viewer.js
          node --check web/edgecrunch.js
          node --check web/edgecrunch-worker.js
          node --check web/export.js
          node --check web/ui.js
          node --check web/color.js

      - name: Check required web files
        shell: bash
        run: |
          test -f web/index.html
          test -f web/style.css
          grep -q "COSMICV EDGECRUNCH DARKROOM WEB" web/index.html
          grep -q "Web Preview 0.4.0" web/index.html
          grep -q "processImage" web/edgecrunch.js
          grep -q "data-tab=\"color\"" web/index.html
          grep -q "divider::after" web/style.css
