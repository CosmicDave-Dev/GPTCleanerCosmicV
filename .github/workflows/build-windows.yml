name: Build CosmicV EdgeCrunch Darkroom V1.4

# Final standalone publishing is manual-only.
# Source edits do not overwrite the public release until explicitly published.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Validate V1.4 source
        shell: pwsh
        run: |
          python -m py_compile CosmicVEdgeCrunchDarkroom.py
          python tests/smoke_test.py

      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --name "CosmicV-EdgeCrunch-Darkroom" `
            --icon "assets/CosmicDaveIcon.ico" `
            --add-data "assets/CosmicDaveIcon.ico;." `
            --version-file "version_info.txt" `
            --hidden-import "PIL._tkinter_finder" `
            --collect-all "tkinterdnd2" `
            "CosmicVEdgeCrunchDarkroom.py"

      - name: Stage V1.4 release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/CosmicV-EdgeCrunch-Darkroom.exe" "release/CosmicV-EdgeCrunch-Darkroom.exe"
          Copy-Item "LICENSE" "release/LICENSE.txt"
          Copy-Item "docs/WINDOWS-EXE-INSTALL.txt" "release/README.txt"
          Compress-Archive -Force `
            -Path "release/CosmicV-EdgeCrunch-Darkroom.exe","release/LICENSE.txt","release/README.txt" `
            -DestinationPath "CosmicV-EdgeCrunch-Darkroom-V1.4-Windows-x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmicV-EdgeCrunch-Darkroom-V1.4-Windows-x64
          path: |
            release/*
            CosmicV-EdgeCrunch-Darkroom-V1.4-Windows-x64.zip
          if-no-files-found: error
          compression-level: 6

      - name: Prepare V1.4 release notes
        shell: pwsh
        run: |
          $hash = (Get-FileHash "release/CosmicV-EdgeCrunch-Darkroom.exe" -Algorithm SHA256).Hash.ToLower()
          @"
          # CosmicV EdgeCrunch Darkroom V1.4

          CosmicV EdgeCrunch Darkroom is a local Windows image-cleaning and darkroom utility created at **Cosmic Dave Studios**.

          **CosmicV is original software and completely free - just like you!**

          ## V1.4

          - EdgeCrunch cleanup with Conservative, Balanced, Strong, and Aggressive presets
          - Advanced cleanup controls with numerical input
          - Draggable before/after comparison and Target Mask diagnostic view
          - Cursor-centered mouse-wheel zoom and right-drag pan
          - Explorer drag-and-drop
          - Color Lab with hue wheel, brightness, contrast, saturation, warmth, exposure, gamma, and adjustment mix
          - Grayscale, sepia, invert, blur, sharpen, and vignette
          - Rotate and flip controls
          - Save and Save As workflow
          - PNG, JPEG, WebP, GIF, ICO, BMP, and TIFF export
          - 512 x 512 avatar export with 300 DPI metadata where supported
          - Multi-resolution Windows ICO export
          - Current Version link in the application header
          - High-DPI Windows rendering and F11 fullscreen mode
          - Cosmic Dave Studios Spade application icon
          - Standalone EXE with Python and runtime dependencies bundled

          Crop and freeform resize controls are intentionally not included in V1.4.

          ## Install

          Download **CosmicV-EdgeCrunch-Darkroom.exe** and run it. No separate Python installation is required.

          Windows SmartScreen may warn because the executable is not code-signed.

          **EXE SHA-256:** $hash
          "@ | Set-Content -Encoding UTF8 "release-notes.md"

      - name: Publish GitHub release V1.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "V1.4"
          $exe = "release/CosmicV-EdgeCrunch-Darkroom.exe"
          $zip = "CosmicV-EdgeCrunch-Darkroom-V1.4-Windows-x64.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $zip --clobber
            gh release edit $tag `
              --title "CosmicV EdgeCrunch Darkroom V1.4" `
              --notes-file "release-notes.md" `
              --latest
          } else {
            gh release create $tag $exe $zip `
              --target "$env:GITHUB_SHA" `
              --title "CosmicV EdgeCrunch Darkroom V1.4" `
              --notes-file "release-notes.md" `
              --latest
          }
