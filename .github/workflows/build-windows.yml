name: Build Windows EXE

on:
  push:
    branches:
      - main
    paths:
      - "beta/CosmicVEdgeCrunchBeta.py"
      - "requirements.txt"
      - "version_info.txt"
      - "assets/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install tkinterdnd2==0.6.3 pyinstaller

      - name: Validate final source
        shell: pwsh
        run: |
          python -m py_compile beta/CosmicVEdgeCrunchBeta.py
          python beta/smoke_test.py

      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --name "GPTCleanerCosmicV" `
            --icon "assets/CosmicDaveIcon.ico" `
            --version-file "version_info.txt" `
            --hidden-import "PIL._tkinter_finder" `
            --collect-all "tkinterdnd2" `
            "beta/CosmicVEdgeCrunchBeta.py"

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/GPTCleanerCosmicV.exe" "release/GPTCleanerCosmicV.exe"
          Copy-Item "LICENSE" "release/LICENSE.txt"
          Copy-Item "docs/WINDOWS-EXE-INSTALL.txt" "release/README.txt"
          Compress-Archive -Force `
            -Path "release/GPTCleanerCosmicV.exe","release/LICENSE.txt","release/README.txt" `
            -DestinationPath "GPTCleanerCosmicV-v0.2.0-Windows-x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPTCleanerCosmicV-v0.2.0-Windows-x64
          path: |
            release/*
            GPTCleanerCosmicV-v0.2.0-Windows-x64.zip
          if-no-files-found: error
          compression-level: 6

      - name: Prepare release notes
        shell: pwsh
        run: |
          $hash = (Get-FileHash "release/GPTCleanerCosmicV.exe" -Algorithm SHA256).Hash.ToLower()
          @"
          CosmicV EdgeCrunch Darkroom is a portable Windows application for AI-image artifact cleanup and darkroom adjustment.

          ## Final Darkroom build

          - EdgeCrunch cleanup with curated presets and advanced controls
          - Before/after draggable comparison
          - Target-mask diagnostic view
          - Color Lab with hue wheel, brightness, contrast, saturation, warmth, exposure, gamma, and adjustment mix
          - Effects and lossless rotate/flip controls
          - Scrollable Color tab for lower-resolution displays
          - Native high-DPI Windows rendering
          - Explorer drag-and-drop
          - Full-resolution save and comparison export
          - Standalone Windows EXE with Python, OpenCV, NumPy, Pillow, and tkinterdnd2 bundled

          ## Install

          Download **GPTCleanerCosmicV.exe** and run it. No separate Python install is required.

          Windows SmartScreen may warn because the executable is not code-signed.

          **EXE SHA-256:** $hash
          "@ | Set-Content -Encoding UTF8 "release-notes.md"

      - name: Update rolling GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "AI_Image_Artifact_Removal" `
            "release/GPTCleanerCosmicV.exe" `
            "GPTCleanerCosmicV-v0.2.0-Windows-x64.zip" `
            --clobber
          gh release edit "AI_Image_Artifact_Removal" `
            --title "CosmicV EdgeCrunch Darkroom" `
            --notes-file "release-notes.md" `
            --latest

      - name: Move rolling release tag to this commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "AI_Image_Artifact_Removal" "$env:GITHUB_SHA"
          git push origin "refs/tags/AI_Image_Artifact_Removal" --force

# Rolling release publisher: EdgeCrunch Darkroom final
