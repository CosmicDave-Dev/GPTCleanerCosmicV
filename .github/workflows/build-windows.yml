name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --name "GPTCleanerCosmicV" `
            --icon "assets/CosmicDaveIcon.ico" `
            --version-file "version_info.txt" `
            --hidden-import "PIL._tkinter_finder" `
            "GPTCleanerCosmicV.py"

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/GPTCleanerCosmicV.exe" "release/GPTCleanerCosmicV.exe"
          Copy-Item "LICENSE" "release/LICENSE.txt"
          Copy-Item "docs/WINDOWS-EXE-INSTALL.txt" "release/README.txt"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GPTCleanerCosmicV-v0.2.0-Windows-x64
          path: release/*
          if-no-files-found: error
          compression-level: 6
