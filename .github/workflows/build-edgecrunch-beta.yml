name: Package EdgeCrunch Darkroom Beta

on:
  push:
    branches:
      - main
    paths:
      - "beta/CosmicVEdgeCrunchBeta.py"
      - "beta/RUN-CosmicV-Beta.bat"
      - "beta/README.md"
      - "beta/smoke_test.py"
      - "requirements.txt"
      - ".github/workflows/build-edgecrunch-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-beta:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install beta test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check tkinterdnd2==0.6.3

      - name: Validate beta pipeline
        shell: pwsh
        run: |
          python -m py_compile beta/CosmicVEdgeCrunchBeta.py
          python beta/smoke_test.py

      - name: Prepare click-to-run beta package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-beta/CosmicV-Beta | Out-Null
          Copy-Item beta/CosmicVEdgeCrunchBeta.py dist-beta/CosmicV-Beta/CosmicV-EdgeCrunch-Darkroom-Beta.py
          Copy-Item beta/RUN-CosmicV-Beta.bat dist-beta/CosmicV-Beta/RUN-CosmicV-Beta.bat

          # Vendor only the drag/drop support needed by the beta. It stays local
          # to the ZIP and does not modify the tester's Python installation.
          python -m pip install --disable-pip-version-check --no-deps --target dist-beta/CosmicV-Beta/_vendor tkinterdnd2==0.6.3

          $tkdnd = "dist-beta/CosmicV-Beta/_vendor/tkinterdnd2/tkdnd"
          if (Test-Path $tkdnd) {
            Get-ChildItem $tkdnd -Directory |
              Where-Object { $_.Name -notmatch "^win" } |
              Remove-Item -Recurse -Force
          }

          $license = Get-ChildItem dist-beta/CosmicV-Beta/_vendor -Recurse -File |
            Where-Object { $_.FullName -match "tkinterdnd2.*dist-info.*LICENSE" } |
            Select-Object -First 1
          if ($license) {
            Copy-Item $license.FullName dist-beta/CosmicV-Beta/THIRD-PARTY-tkinterdnd2-LICENSE.txt
          }

          Compress-Archive -Path dist-beta/CosmicV-Beta/* -DestinationPath dist-beta/CosmicV-EdgeCrunch-Darkroom-Beta.zip -Force

          $zip = Get-Item dist-beta/CosmicV-EdgeCrunch-Darkroom-Beta.zip
          $soft = 524288
          $hard = 1000000
          Write-Host "Final ZIP bytes: $($zip.Length)"

          if ($zip.Length -gt $soft) {
            Write-Warning "Beta ZIP is above the 512 KB soft target: $($zip.Length) bytes"
          } else {
            Write-Host "Size budget healthy: $($zip.Length) / $soft bytes soft target"
          }

          if ($zip.Length -gt $hard) {
            Write-Error "Beta ZIP exceeds the 1,000,000 byte hard limit."
            exit 1
          }

          Get-FileHash $zip.FullName -Algorithm SHA256

      - name: Upload beta package
        uses: actions/upload-artifact@v4
        with:
          name: CosmicV-EdgeCrunch-Darkroom-Beta
          path: dist-beta/CosmicV-EdgeCrunch-Darkroom-Beta.zip
          if-no-files-found: error
          compression-level: 0
