name: Package EdgeCrunch Darkroom Beta

on:
  push:
    branches:
      - main
    paths:
      - "beta/CosmicVEdgeCrunchBeta.py"
      - "beta/RUN-CosmicV-Beta.bat"
      - "beta/README.md"
      - "beta/smoke_test.py"
      - "requirements.txt"
      - ".github/workflows/build-edgecrunch-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-beta:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install beta test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate beta pipeline
        shell: pwsh
        run: |
          python -m py_compile beta/CosmicVEdgeCrunchBeta.py
          python beta/smoke_test.py

      - name: Prepare click-to-run beta package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-beta/CosmicV-Beta | Out-Null
          Copy-Item beta/CosmicVEdgeCrunchBeta.py dist-beta/CosmicV-Beta/CosmicV-EdgeCrunch-Darkroom-Beta.py
          Copy-Item beta/RUN-CosmicV-Beta.bat dist-beta/CosmicV-Beta/RUN-CosmicV-Beta.bat

          $script = Get-Item dist-beta/CosmicV-Beta/CosmicV-EdgeCrunch-Darkroom-Beta.py
          $launcher = Get-Item dist-beta/CosmicV-Beta/RUN-CosmicV-Beta.bat
          $total = $script.Length + $launcher.Length
          $soft = 524288
          $hard = 1000000

          Write-Host "Script bytes: $($script.Length)"
          Write-Host "Launcher bytes: $($launcher.Length)"
          Write-Host "Total source package bytes: $total"

          if ($total -gt $soft) {
            Write-Warning "Beta source package is above the 512 KB soft target: $total bytes"
          } else {
            Write-Host "Size budget healthy: $total / $soft bytes soft target"
          }

          if ($total -gt $hard) {
            Write-Error "Beta source package exceeds the 1,000,000 byte hard limit."
            exit 1
          }

          Compress-Archive -Path dist-beta/CosmicV-Beta/* -DestinationPath dist-beta/CosmicV-EdgeCrunch-Darkroom-Beta.zip -Force
          Get-FileHash dist-beta/CosmicV-EdgeCrunch-Darkroom-Beta.zip -Algorithm SHA256

      - name: Upload beta package
        uses: actions/upload-artifact@v4
        with:
          name: CosmicV-EdgeCrunch-Darkroom-Beta
          path: dist-beta/CosmicV-EdgeCrunch-Darkroom-Beta.zip
          if-no-files-found: error
          compression-level: 0
