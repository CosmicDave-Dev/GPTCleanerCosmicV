name: Package EdgeCrunch Darkroom Beta

on:
  push:
    branches:
      - main
    paths:
      - "beta/CosmicVEdgeCrunchBeta.py"
      - "beta/README.md"
      - "beta/smoke_test.py"
      - "requirements.txt"
      - ".github/workflows/build-edgecrunch-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-pyw-beta:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install beta test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate beta pipeline
        shell: pwsh
        run: |
          python -m py_compile beta/CosmicVEdgeCrunchBeta.py
          python beta/smoke_test.py

      - name: Prepare single-file PYW beta
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-beta | Out-Null
          Copy-Item beta/CosmicVEdgeCrunchBeta.py dist-beta/CosmicV-EdgeCrunch-Darkroom-Beta.pyw

          $file = Get-Item dist-beta/CosmicV-EdgeCrunch-Darkroom-Beta.pyw
          $size = $file.Length
          $soft = 524288
          $hard = 1000000

          Write-Host "PYW size: $size bytes"
          Get-FileHash $file.FullName -Algorithm SHA256

          if ($size -gt $soft) {
            Write-Warning "Beta file is above the 512 KB soft target: $size bytes"
          } else {
            Write-Host "Size budget healthy: $size / $soft bytes soft target"
          }

          if ($size -gt $hard) {
            Write-Error "Beta file exceeds the 1,000,000 byte hard limit."
            exit 1
          }

      - name: Upload beta package
        uses: actions/upload-artifact@v4
        with:
          name: CosmicV-EdgeCrunch-Darkroom-Beta-PYW
          path: dist-beta/CosmicV-EdgeCrunch-Darkroom-Beta.pyw
          if-no-files-found: error
          compression-level: 9
